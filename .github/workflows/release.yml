# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Force publish to npm (skip release-please)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FORCE_COLOR: 1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        id: release
        with:
          release-type: node

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release-please
    # Guard: update org/repo if this repository is ever renamed or transferred
    if: github.repository == 'mrkanitkar/playwright-praman' && (needs.release-please.outputs.release_created || github.event.inputs.publish == 'true')
    environment:
      name: npm
      url: https://www.npmjs.com/package/playwright-praman
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Verify clean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after build — do not publish with uncommitted changes"
            git status --short
            git diff
            exit 1
          fi
      - name: Validate export map
        run: npm run check:exports
      - run: npm run generate:sbom -- --ignore-npm-errors
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  post-release-canary:
    name: Advance @next after release
    needs: npm-publish
    if: needs.npm-publish.result == 'success'
    uses: ./.github/workflows/canary.yml
    secrets: inherit
