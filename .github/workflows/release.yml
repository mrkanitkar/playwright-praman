# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Force publish to npm (skip release-please)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

env:
  FORCE_COLOR: 1

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  integration-tests:
    name: Integration Tests (PW ${{ matrix.playwright-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: release-please
    if: needs.release-please.outputs.release_created || github.event.inputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        playwright-version: ['1.57.0', '1.60.0']
    env:
      SAP_CLOUD_BASE_URL: ${{ secrets.SAP_CLOUD_BASE_URL }}
      SAP_CLOUD_USERNAME: ${{ secrets.SAP_CLOUD_USERNAME }}
      SAP_CLOUD_PASSWORD: ${{ secrets.SAP_CLOUD_PASSWORD }}
      SAP_CLIENT: ${{ secrets.SAP_CLIENT }}
    steps:
      - name: Check SAP credentials
        id: check-creds
        run: |
          if [ -z "$SAP_CLOUD_BASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SAP credentials not configured — skipping integration tests"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: steps.check-creds.outputs.skip == 'false'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.check-creds.outputs.skip == 'false'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        if: steps.check-creds.outputs.skip == 'false'
      - run: npm run build
        if: steps.check-creds.outputs.skip == 'false'
      - run: npm install @playwright/test@${{ matrix.playwright-version }}
        if: steps.check-creds.outputs.skip == 'false'
      - run: npx playwright install --with-deps chromium
        if: steps.check-creds.outputs.skip == 'false'
      - run: npm run test:integration
        if: steps.check-creds.outputs.skip == 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.check-creds.outputs.skip == 'false' }}
        with:
          name: playwright-report-release-pw-${{ matrix.playwright-version }}
          path: playwright-report/
          retention-days: 14

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [release-please, integration-tests]
    # Guard: update org/repo if this repository is ever renamed or transferred
    if: github.repository == 'mrkanitkar/playwright-praman' && (needs.release-please.outputs.release_created || github.event.inputs.publish == 'true')
    environment:
      name: npm
      url: https://www.npmjs.com/package/playwright-praman
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Verify clean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after build — do not publish with uncommitted changes"
            git status --short
            git diff
            exit 1
          fi
      - name: Validate export map
        run: npm run check:exports
      - run: npm run generate:sbom -- --ignore-npm-errors
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  post-release-canary:
    name: Advance @next after release
    needs: npm-publish
    if: needs.npm-publish.result == 'success'
    uses: ./.github/workflows/canary.yml
    secrets: inherit
