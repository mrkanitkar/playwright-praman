# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Spell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx cspell "src/**/*.ts" "docs/**/*.md" --no-progress
      - run: npx knip
      - run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#docs/build" "#docs/node_modules"
      - name: Verify clean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after lint — commit generated files"
            git status --short
            git diff
            exit 1
          fi

  unit-tests:
    name: Unit Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Align npm version
        if: matrix.node-version == 22
        shell: bash
        run: |
          npm i -g npm@11 2>/dev/null || {
            echo "::warning::npm self-upgrade failed — using direct download"
            curl -fsSL https://registry.npmjs.org/npm/-/npm-11.0.0.tgz -o "$RUNNER_TEMP/npm.tgz"
            mkdir -p "$RUNNER_TEMP/npm-pkg"
            tar -xzf "$RUNNER_TEMP/npm.tgz" -C "$RUNNER_TEMP/npm-pkg"
            node "$RUNNER_TEMP/npm-pkg/package/bin/npm-cli.js" install -g npm@11
          }
          echo "npm: $(npm --version)"
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

  build:
    name: Build + Bundle Size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: CJS smoke test
        run: node -e "const m = require('./dist/index.cjs'); if (!m.VERSION) throw new Error('CJS load failed')"
      - name: ESM CLI smoke test
        run: node dist/cli/index.js --version
      - name: CJS CLI smoke test
        run: node dist/cli/index.cjs --version
      - name: Bundle size check
        if: matrix.os == 'ubuntu-latest'
        run: npx size-limit
      - name: Export map validation
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:exports
      - name: Create npm tarball
        if: matrix.os == 'ubuntu-latest'
        run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: matrix.os == 'ubuntu-latest'
        with:
          name: npm-tarball
          path: playwright-praman-*.tgz
          retention-days: 30

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  docs-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx typedoc --validation
      - name: Lint documentation markdown
        working-directory: docs
        run: npx markdownlint-cli2 "docs/guides/**/*.md" "docs/examples/**/*.md"
      - name: Install Docusaurus deps
        working-directory: docs
        run: npm ci
      - name: Build Docusaurus
        working-directory: docs
        run: npm run build -- --no-minify

  azure-playwright:
    name: Azure Playwright Workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'azure-test')
    needs: [quality, build]
    env:
      PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
    steps:
      - name: Skip if Azure credentials not configured
        if: env.PLAYWRIGHT_SERVICE_URL == ''
        run: echo "::warning::PLAYWRIGHT_SERVICE_URL secret not configured — skipping Azure Playwright tests"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: env.PLAYWRIGHT_SERVICE_URL != ''
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: env.PLAYWRIGHT_SERVICE_URL != ''
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        if: env.PLAYWRIGHT_SERVICE_URL != ''
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.PLAYWRIGHT_SERVICE_URL != ''
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
        if: env.PLAYWRIGHT_SERVICE_URL != ''
      - name: Run tests on Azure Playwright Workspaces
        if: env.PLAYWRIGHT_SERVICE_URL != ''
        run: npx playwright test --config=playwright.service.config.ts --workers=20
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && env.PLAYWRIGHT_SERVICE_URL != '' }}
        with:
          name: azure-playwright-report
          path: playwright-report/
          retention-days: 14

  ts-compat:
    name: TS Compat (TypeScript ${{ matrix.ts-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ts-version: ['5.9.3', '6.0.2']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - name: Override TypeScript version
        run: npm install --save-dev --save-exact typescript@${{ matrix.ts-version }}
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build (JS only — DTS validated in main build job)
        run: npx tsup --no-dts

  playwright-floor:
    name: Playwright Floor (1.57.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm install @playwright/test@1.57.0
      - run: npm run build
      - run: npm run test:unit
