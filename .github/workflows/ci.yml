# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_COLOR: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint + Typecheck + Spell
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx cspell "src/**/*.ts" "docs/**/*.md" --no-progress
      - run: npx knip
      - run: npx markdownlint-cli2 "**/*.md" "#node_modules" "#docs/build" "#docs/node_modules"
      - name: Verify clean tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after lint — commit generated files"
            git status --short
            git diff
            exit 1
          fi

  unit-tests:
    name: Unit Tests (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run test:unit -- --coverage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 30

  build:
    name: Build + Bundle Size (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: CJS smoke test
        run: node -e "const m = require('./dist/index.cjs'); if (!m.VERSION) throw new Error('CJS load failed')"
      - name: ESM CLI smoke test
        run: node dist/cli/index.js --version
      - name: CJS CLI smoke test
        run: node dist/cli/index.cjs --version
      - name: Bundle size check
        if: matrix.os == 'ubuntu-latest'
        run: npx size-limit
      - name: Export map validation
        if: matrix.os == 'ubuntu-latest'
        run: npm run check:exports
      - name: Create npm tarball
        if: matrix.os == 'ubuntu-latest'
        run: npm pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: dist/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.os == 'ubuntu-latest'
        with:
          name: npm-tarball
          path: playwright-praman-*.tgz
          retention-days: 30

  integration-tests:
    name: Integration Tests (PW ${{ matrix.playwright-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [quality, build]
    strategy:
      fail-fast: false
      matrix:
        playwright-version: ['1.57.0', '1.58.2']
    env:
      SAP_CLOUD_BASE_URL: ${{ secrets.SAP_CLOUD_BASE_URL }}
      SAP_CLOUD_USERNAME: ${{ secrets.SAP_CLOUD_USERNAME }}
      SAP_CLOUD_PASSWORD: ${{ secrets.SAP_CLOUD_PASSWORD }}
      SAP_CLIENT: ${{ secrets.SAP_CLIENT }}
    steps:
      - name: Check SAP credentials
        id: check-creds
        run: |
          if [ -z "$SAP_CLOUD_BASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SAP credentials not configured — skipping integration tests"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.check-creds.outputs.skip == 'false'
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        if: steps.check-creds.outputs.skip == 'false'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        if: steps.check-creds.outputs.skip == 'false'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.check-creds.outputs.skip == 'false'
        with:
          name: dist
          path: dist/
      - run: npm install @playwright/test@${{ matrix.playwright-version }}
        if: steps.check-creds.outputs.skip == 'false'
      - run: npx playwright install --with-deps chromium
        if: steps.check-creds.outputs.skip == 'false'
      - run: npm run test:integration
        if: steps.check-creds.outputs.skip == 'false'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() && steps.check-creds.outputs.skip == 'false' }}
        with:
          name: playwright-report-pw-${{ matrix.playwright-version }}
          path: playwright-report/
          retention-days: 14

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev

  docs-check:
    name: Documentation Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npx typedoc --validation
      - name: Install Docusaurus deps
        working-directory: docs
        run: npm ci
      - name: Build Docusaurus
        working-directory: docs
        run: npm run build -- --no-minify

  azure-playwright:
    name: Azure Playwright Workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'azure-test')
    needs: [quality, build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - name: Run tests on Azure Playwright Workspaces
        run: npx playwright test --config=playwright.service.config.ts --workers=20
        env:
          PLAYWRIGHT_SERVICE_URL: ${{ secrets.PLAYWRIGHT_SERVICE_URL }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !cancelled() }}
        with:
          name: azure-playwright-report
          path: playwright-report/
          retention-days: 14
