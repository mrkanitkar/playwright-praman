# .github/workflows/repomix.yml
name: Repomix Context

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_COLOR: 1

concurrency:
  group: repomix
  cancel-in-progress: true

jobs:
  repomix:
    name: Generate Repomix Context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Repomix
        run: npx repomix@latest --version

      - name: Generate context
        run: npx repomix@latest

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: praman-context
          path: praman-context.md
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" praman-context.md --clobber
