# .github/workflows/repomix.yml
name: Repomix Context

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_COLOR: 1

concurrency:
  group: repomix
  cancel-in-progress: true

jobs:
  repomix:
    name: Generate Repomix Context
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Repomix
        run: npx repomix@latest --version

      - name: Generate context
        run: npx repomix@latest

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: praman-context
          path: praman-context.md
          retention-days: 90

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" praman-context.md --clobber
