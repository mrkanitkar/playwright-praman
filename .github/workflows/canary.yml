# .github/workflows/canary.yml
name: Canary Publish

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  id-token: write

env:
  FORCE_COLOR: 1

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  integration-tests:
    name: Integration Tests (PW ${{ matrix.playwright-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        playwright-version: ['1.57.0', '1.60.0']
        include:
          - playwright-version: 'next'
            canary: true
    continue-on-error: ${{ matrix.canary || false }}
    env:
      SAP_CLOUD_BASE_URL: ${{ secrets.SAP_CLOUD_BASE_URL }}
      SAP_CLOUD_USERNAME: ${{ secrets.SAP_CLOUD_USERNAME }}
      SAP_CLOUD_PASSWORD: ${{ secrets.SAP_CLOUD_PASSWORD }}
      SAP_CLIENT: ${{ secrets.SAP_CLIENT }}
    steps:
      - name: Check SAP credentials
        id: check-creds
        run: |
          if [ -z "$SAP_CLOUD_BASE_URL" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::SAP credentials not configured — skipping integration tests"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.check-creds.outputs.skip == 'false'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.check-creds.outputs.skip == 'false'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
        if: steps.check-creds.outputs.skip == 'false'
      - run: npm run build
        if: steps.check-creds.outputs.skip == 'false'
      - run: npm install @playwright/test@${{ matrix.playwright-version }}
        if: steps.check-creds.outputs.skip == 'false'
      - run: npx playwright install --with-deps chromium
        if: steps.check-creds.outputs.skip == 'false'
      - run: npm run test:integration
        if: steps.check-creds.outputs.skip == 'false'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() && steps.check-creds.outputs.skip == 'false' }}
        with:
          name: playwright-report-canary-pw-${{ matrix.playwright-version }}
          path: playwright-report/
          retention-days: 14

  canary-publish:
    name: Publish @next to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [integration-tests]
    # Guard: update org/repo if this repository is ever renamed or transferred
    if: github.repository == 'mrkanitkar/playwright-praman'
    environment:
      name: npm
      url: https://www.npmjs.com/package/playwright-praman
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Validate export map
        run: npm run check:exports
      - name: Stamp canary version
        env:
          FORCE_COLOR: 0
        run: |
          BASE=$(node -p "require('./package.json').version")
          # Bump patch to get the next unreleased version (e.g. 1.0.2 → 1.0.3)
          # so that next > latest in semver, matching Playwright's convention
          NEXT_BASE=$(node -p "const [maj,min,pat]='${BASE}'.split('.'); \`\${maj}.\${min}.\${Number(pat)+1}\`")
          # Query npm for existing alphas of that next patch version
          LATEST=$(npm view playwright-praman versions --json 2>/dev/null \
            | node -p "
                const raw = require('fs').readFileSync('/dev/stdin','utf8');
                const parsed = JSON.parse(raw);
                const versions = Array.isArray(parsed) ? parsed : [parsed];
                const alphas = versions
                  .filter(v => v.startsWith('${NEXT_BASE}-alpha.'))
                  .map(v => Number(v.split('-alpha.')[1]))
                  .filter(n => Number.isFinite(n));
                alphas.length ? Math.max(...alphas) : -1;
              ")
          NEXT=$((LATEST + 1))
          npm version "${NEXT_BASE}-alpha.${NEXT}" --no-git-tag-version
          echo "📦 Canary version: ${NEXT_BASE}-alpha.${NEXT}"
      - name: Verify clean tree (only version bump expected)
        run: |
          CHANGED=$(git diff --name-only | sort)
          ALLOWED=$(printf 'package-lock.json\npackage.json')
          if [ "$CHANGED" != "$ALLOWED" ] && [ "$CHANGED" != "package.json" ]; then
            echo "::error::Unexpected changes after version stamp"
            git diff --stat
            exit 1
          fi
      - run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
