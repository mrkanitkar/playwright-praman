# .github/workflows/canary.yml
name: Canary Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_COLOR: 1

concurrency:
  group: canary
  cancel-in-progress: false

jobs:
  canary-publish:
    name: Publish @next to npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Guard: update org/repo if this repository is ever renamed or transferred
    if: github.repository == 'mrkanitkar/playwright-praman'
    environment:
      name: npm
      url: https://www.npmjs.com/package/playwright-praman
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Validate export map
        run: npm run check:exports
      - name: Stamp canary version
        env:
          FORCE_COLOR: 0
        run: |
          BASE=$(node -p "require('./package.json').version")
          # Query npm for the latest published alpha of this base version
          LATEST=$(npm view playwright-praman "versions" --json 2>/dev/null \
            | node -p "
                const versions = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
                const alphas = versions
                  .filter(v => v.startsWith('${BASE}-alpha.'))
                  .map(v => Number(v.split('-alpha.')[1]))
                  .filter(n => Number.isFinite(n));
                alphas.length ? Math.max(...alphas) : -1;
              ")
          NEXT=$((LATEST + 1))
          npm version "${BASE}-alpha.${NEXT}" --no-git-tag-version
          echo "📦 Canary version: ${BASE}-alpha.${NEXT}"
      - name: Verify clean tree (only version bump expected)
        run: |
          CHANGED=$(git diff --name-only | sort)
          ALLOWED=$(printf 'package-lock.json\npackage.json')
          if [ "$CHANGED" != "$ALLOWED" ] && [ "$CHANGED" != "package.json" ]; then
            echo "::error::Unexpected changes after version stamp"
            git diff --stat
            exit 1
          fi
      - run: npm publish --provenance --access public --tag next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
