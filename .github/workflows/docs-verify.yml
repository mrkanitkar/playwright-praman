# .github/workflows/docs-verify.yml
name: Docs Accuracy Verification

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'scripts/docs-verify/**'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verification mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - pr
      checks:
        description: 'Checks to run (comma-separated numbers, e.g. 1,4)'
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_COLOR: 1

concurrency:
  group: docs-verify-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-verify:
    name: Verify Documentation Accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0 # needed for git diff in PR mode
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Run docs verification (PR mode)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npm run docs:verify:pr -- --checks=1,2,3,4 --failOn=error || true
        # Checks 5,6 require claim tags/example tags (incremental adoption)
        # Checks 7,8 require API keys / network (separate job)

      - name: Run docs verification (full mode)
        if: github.event_name != 'pull_request'
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          CHECKS="${{ github.event.inputs.checks || '' }}"
          ARGS="--mode=$MODE"
          if [ -n "$CHECKS" ]; then
            ARGS="$ARGS --checks=$CHECKS"
          fi
          npm run docs:verify -- $ARGS --failOn=error || true

      - name: Upload verification reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-verify-reports
          path: docs-verify-reports/
          retention-days: 30

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const summaryPath = 'docs-verify-reports/summary.json';
            if (!fs.existsSync(summaryPath)) {
              console.log('No summary.json found — skipping PR comment');
              return;
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf-8'));
            const { totalDocs, passed, failed, warned } = summary;

            let body = '## Docs Accuracy Report\n\n';
            const parts = [];
            if (failed > 0) parts.push(`**${failed} failed**`);
            if (warned > 0) parts.push(`${warned} warning${warned > 1 ? 's' : ''}`);
            parts.push(`${passed} passed`);
            parts.push(`${totalDocs} docs checked`);
            body += parts.join(' | ') + '\n\n';

            if (failed > 0) {
              body += '### Failed Docs\n\n';
              for (const doc of summary.docs.filter(d => d.verdict === 'fail')) {
                body += `- **${doc.shortName}** — ${doc.errors} error${doc.errors > 1 ? 's' : ''}\n`;
              }
              body += '\n';
            }

            body += `<details><summary>Full report</summary>\n\nSee the \`docs-verify-reports\` artifact for detailed JSON reports.\n\n</details>`;

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '## Docs Accuracy Report';
            const existing = comments.find(c => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
