# .github/workflows/docs.yml
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**/*.ts'
      - 'typedoc.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_COLOR: 1

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Docusaurus + TypeDoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # Root install — provides TypeScript source for docusaurus-plugin-typedoc
      - run: npm ci
      - run: npm run build
      # Generate standalone TypeDoc HTML into docs/static/api-html/
      - name: Generate TypeDoc HTML
        run: npm run docs:api-html
      # Docusaurus install + build (docusaurus-plugin-typedoc auto-generates API docs)
      - name: Install Docusaurus deps
        working-directory: docs
        run: npm ci
      - name: Clear Docusaurus cache
        working-directory: docs
        run: npx docusaurus clear
      - name: Build Docusaurus
        working-directory: docs
        run: npm run build
      # Inline upload-pages-artifact to avoid internal actions/upload-artifact@v4 tag
      # reference that fails SHA-pinning policy (composite action uses tag, not SHA)
      - name: Archive Pages artifact
        run: |
          tar \
            --dereference --hard-dereference \
            --directory docs/build \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git \
            --exclude=.github \
            .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
