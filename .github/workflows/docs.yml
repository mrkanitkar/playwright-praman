# .github/workflows/docs.yml
name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**/*.ts'
      - 'typedoc.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_COLOR: 1

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build Docusaurus + TypeDoc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      # Root install — provides TypeScript source for docusaurus-plugin-typedoc
      - run: npm ci
      - run: npm run build
      # Generate standalone TypeDoc HTML into docs/static/api-html/
      - name: Generate TypeDoc HTML
        run: npm run docs:api-html
      # Docusaurus install + build (docusaurus-plugin-typedoc auto-generates API docs)
      - name: Install Docusaurus deps
        working-directory: docs
        run: npm ci
      - name: Clear Docusaurus cache
        working-directory: docs
        run: npx docusaurus clear
      - name: Build Docusaurus
        working-directory: docs
        run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/build

  deploy-docs:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
