name: Report regression
description: Functionality that used to work and does not any more
title: '[Regression]: '
labels: ['bug', 'regression']
body:
  - type: markdown
    attributes:
      value: |
        # Please follow these steps first:
  - type: markdown
    attributes:
      value: |
        ## Make a minimal reproduction
        To file the report, you will need a minimal (but complete) example and clear steps on how to reproduce the regression.
        The simpler you can make it, the more likely we are to successfully verify and fix the regression.
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Regression reports without a minimal reproduction will be rejected.

        ---
  - type: input
    id: goodVersion
    attributes:
      label: Last Good Version
      description: |
        Last version of playwright-praman where the feature was working.
      placeholder: ex. 1.0.0
    validations:
      required: true
  - type: input
    id: badVersion
    attributes:
      label: First Bad Version
      description: |
        First version of playwright-praman where the feature was broken.
        Is it the [latest](https://github.com/mrkanitkar/playwright-praman/releases)? Test and see if the regression has already been fixed.
      placeholder: ex. 1.0.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Please provide a minimal reproduction and describe accurately how we can reproduce/verify the regression.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A description of what you expect to happen.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Actual behavior
      description: |
        A clear and concise description of the unexpected behavior.
        Please include any relevant output here, especially any error messages.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant
    validations:
      required: false
  - type: textarea
    id: envinfo
    attributes:
      label: Environment
      description: |
        Please provide your environment details.
      placeholder: |
        OS: macOS 15.3
        Node: 22.x
        Playwright: 1.57.x
        playwright-praman: 1.0.1
        SAP UI5: 1.120.x (if applicable)
      render: shell
    validations:
      required: true
