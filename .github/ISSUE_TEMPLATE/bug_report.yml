name: Bug Report
description: Create a bug report to help us improve
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        # Please follow these steps first:
  - type: markdown
    attributes:
      value: |
        ## Troubleshoot
        If playwright-praman is not behaving the way you expect, please check the [documentation](https://github.com/mrkanitkar/playwright-praman#readme) and search existing issues first.
        Please make reasonable efforts to troubleshoot and rule out issues with your code, configuration, or SAP system setup.
  - type: markdown
    attributes:
      value: |
        ## Make a minimal reproduction
        To file the report, you will need a minimal (but complete) example and clear steps on how to reproduce the bug.
        The simpler you can make it, the more likely we are to successfully verify and fix the bug.
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > Bug reports without a minimal reproduction will be rejected.

        ---
  - type: input
    id: version
    attributes:
      label: Version
      description: |
        The version of playwright-praman you are using.
        Is it the [latest](https://github.com/mrkanitkar/playwright-praman/releases)? Test and see if the bug has already been fixed.
      placeholder: ex. 1.0.1
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Please provide a minimal reproduction and describe accurately how we can reproduce/verify the bug.
      placeholder: |
        Example steps (replace with your own):
        1. Clone my repo at https://github.com/<myuser>/example
        2. npm install
        3. npx playwright test
        4. You should see the error come up
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A description of what you expect to happen.
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Actual behavior
      description: |
        A clear and concise description of the unexpected behavior.
        Please include any relevant output here, especially any error messages.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant
    validations:
      required: false
  - type: textarea
    id: envinfo
    attributes:
      label: Environment
      description: |
        Please provide your environment details.
        Include Node.js version, Playwright version, OS, and SAP UI5 version if applicable.
      placeholder: |
        OS: macOS 15.3
        Node: 22.x
        Playwright: 1.57.x
        playwright-praman: 1.0.1
        SAP UI5: 1.120.x (if applicable)
      render: shell
    validations:
      required: true
