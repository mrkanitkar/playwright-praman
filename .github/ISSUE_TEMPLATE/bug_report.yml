name: Bug Report
description: Report a bug in playwright-praman
labels: ['bug', 'triage']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package Version
      placeholder: '1.0.1'
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Details
      description: Node.js version, Playwright version, SAP UI5 version (if applicable)
      placeholder: |
        Node.js: 22.x
        Playwright: 1.50.x
        SAP UI5: 1.120.x
    validations:
      required: false
