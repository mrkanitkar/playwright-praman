name: Questions / Help
description: If you have questions, please check GitHub Discussions first
title: '[Please read the message below]'
labels: ['question']
body:
  - type: markdown
    attributes:
      value: |
        ## Questions and Help

        This issue tracker is reserved for bug reports and feature requests.

        For anything else, such as questions or getting help, please use:

        - [GitHub Discussions](https://github.com/mrkanitkar/playwright-praman/discussions)
        - [Playwright Documentation](https://playwright.dev)
  - type: checkboxes
    id: no-post
    attributes:
      label: |
        Please do not submit this issue.
      description: |
        > [!IMPORTANT]
        > This issue will be closed.
      options:
        - label: I understand that this issue will be closed
          required: true
