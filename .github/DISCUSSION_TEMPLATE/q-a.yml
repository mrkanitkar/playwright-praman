body:
  - type: textarea
    attributes:
      label: Summary
      description: What do you need help with?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Additional information
      description: Praman version, Playwright version, SAP system type, error messages, or config snippets.
      render: typescript
    validations:
      required: false
  - type: input
    attributes:
      label: Reproduction
      description: A link to a minimal reproduction repo or Playwright trace is helpful for debugging.
    validations:
      required: false
